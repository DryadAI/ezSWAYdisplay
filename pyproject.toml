[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezswaydisplay"
version = "0.1.0"
description = "TUI + GUI display manager for Sway: monitor authorization policy + saved layouts"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "PyQt6",
    "i3ipc",
    "questionary",
]

[project.scripts]
ezswaydisplay = "ezsway.main:main"

[tool.setuptools.packages.find]
include = ["ezsway*"]
